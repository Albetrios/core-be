# Nightly k6 load tests against an ephemeral API (Postgres + Redis).
# Gate: health-stress, api-stress, login-smoke, permission-cached, stripe-webhook-ingest, idempotency-storm (SLO thresholds). Informational: auth, daily-ops, billing, webhooks, admin, org-scoped routes (incl. rls-concurrency-beyond-pool), organization writes (roles, permissions, settings, notifications), fe-full-surface (every call core-fe makes).
# Secrets (optional email): RESEND_API_KEY, TEST_RESULT_EMAIL_TO
name: Scheduled k6 API load & SLO

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  k6:
    name: k6 SLO gate and scenarios
    runs-on: ubuntu-latest
    # ~48 min of k6 (gate ≈ 7, informational ≈ 9, organization-scoped ≈ 12, organization writes ≈ 10,
    # fe-full-surface ≈ 3)
    # plus setup; the headroom keeps one slow night from being cut off mid-scenario.
    timeout-minutes: 60
    # RESEND_API_KEY / TEST_RESULT_EMAIL_TO are environment secrets; without this
    # the job resolves the repository-level copies. `development` has no
    # protection rules, so a scheduled run needs no approval.
    environment: development

    services:
      postgres:
        image: postgres:17.10-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core
        options: >-
          --health-cmd="pg_isready -U postgres -d core"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:8.6.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: development
      LOG_LEVEL: warn
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core
      REDIS_URL: redis://localhost:6379
      ENABLE_MCP_SERVER: 'true'
      BASE_URL: http://localhost:3000
      # Fixed demo account for db:seed:full + the k6 auth scenarios (password login).
      DEMO_EMAIL: demo@example.com
      DEMO_PASSWORD: DemoPassword123!
      # Test-run gate: lets /auth/email/send-code echo debug_verification_code so the
      # passwordless-signup scenario can complete. A refine forbids TEST_MODE=true in production.
      TEST_MODE: 'true'
      # Every k6 request comes from one source IP, so the tight per-route caps (login, webhook)
      # would answer 429 instead of measuring the route; the Vitest harness relaxes them the same
      # way. A refine forbids RATE_LIMIT_RELAXED_CAPS=true in production.
      RATE_LIMIT_RELAXED_CAPS: 'true'
      # CI-only fixture, the one the Vitest harness uses. The webhook route answers 503 until a
      # secret is configured, and stripe-webhook-ingest asserts the 400 for a missing signature.
      STRIPE_WEBHOOK_SECRET: whsec_test_contract_fixture_secret_minimum_length_32_chars_xx
      # The webhooks scenario creates webhooks pointing at example.com; the SSRF guard only accepts
      # allowlisted hosts (the local load rig allowlists the same one). Nothing is delivered: this job
      # runs no worker.
      WEBHOOK_URL_ALLOWLIST: example.com
      # CI-only fixtures, the Vitest harness's. /auth/email/send-code answers 503 until email is
      # configured, which failed every passwordless-signup request. Mail only lands in the outbox —
      # this job runs no worker — so nothing is sent. The results-email step keeps its own secret.
      RESEND_API_KEY: re_test_contract_fixture_key
      EMAIL_FROM_ADDRESS: noreply@example.com
      # The admin and audit-list scenarios need a super_admin token. tool:admin-token signs in as the
      # first GLOBAL_ADMIN_EMAILS entry (ops@example.com, exported by the shared test-env action) with
      # DEMO_PASSWORD. Such a token lives 5 minutes by default, and the admin scenario runs about 10
      # minutes after the refresh step that mints it. CI-only: the same 15 minutes as a user token.
      GLOBAL_ADMIN_ACCESS_TOKEN_EXPIRY_SECONDS: '900'
      # fe-full-surface signs its pool users in with a fixed email code (STATIC_VERIFICATION_CODE)
      # instead of a mailed one. A refine allows this on the local and development targets only.
      AUTH_STATIC_VERIFICATION_CODE_ACCEPT_ENABLED: 'true'
      # CI-only fixtures, the Vitest harness's. fe-full-surface starts a Google sign-in, which answers
      # 302 to the authorize URL (string work, no outbound call) only once a provider is configured.
      OAUTH_GOOGLE_CLIENT_ID: test-google-client-id
      OAUTH_GOOGLE_CLIENT_SECRET: test-google-client-secret
      OAUTH_GOOGLE_REDIRECT_URI: http://localhost:5173/callback/google

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Export shared CI test env (JWT keys + retention + secrets-encryption)
        uses: ./.github/actions/test-env
        # The global limiter keeps running, so its cost is measured, but never rejects the one k6
        # source IP: the schema caps RATE_LIMIT_MAX at 100000, and a 1 s window makes that 100k req/s
        # (the local load rig's setting). At 10000 per minute, api-stress had 97% of its requests
        # answered 429 and starved the scenarios after it.
        with:
          rate-limit-max: '100000'
          rate-limit-window-ms: '1000'

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run migrations
        run: pnpm db:migrate

      - name: Seed full demo data
        run: pnpm db:seed:full

      - name: Seed the super_admin the admin scenarios sign in as
        # Creates DEMO_EMAIL with DEMO_PASSWORD (the job's demo password) as an active member of the
        # demo organization. GLOBAL_ADMIN_EMAILS (the test-env export) makes its token super_admin.
        run: pnpm db:seed:demo-admin
        env:
          DEMO_EMAIL: ops@example.com

      - name: Start API server
        uses: ./.github/actions/start-api-server
        with:
          rate-limit-max: '100000'
          ready-timeout-seconds: '80'

      - name: Export load-test credentials and admin token
        run: bash src/tests/load/k6/export-load-test-credentials.sh

      - name: Gate — health stress + API stress (k6 SLO)
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          k6 run --summary-export=k6-health-stress.json src/tests/load/k6/scenarios/health-stress.js
          k6 run --summary-export=k6-api-stress.json src/tests/load/k6/scenarios/api-stress.js
          k6 run --summary-export=k6-login-smoke.json src/tests/load/k6/scenarios/login-smoke.js
          k6 run --summary-export=k6-permission-cached.json src/tests/load/k6/scenarios/permission-cached.js
          k6 run --summary-export=k6-stripe-webhook-ingest.json src/tests/load/k6/scenarios/stripe-webhook-ingest.js
          k6 run --summary-export=k6-idempotency-storm.json src/tests/load/k6/scenarios/idempotency-storm.js

      - name: Refresh load-test credentials (before the informational scenarios)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Access tokens live 15 minutes; the block below would outlast one minted earlier.
        run: bash src/tests/load/k6/export-load-test-credentials.sh

      - name: k6 auth-onboarding (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >
          k6 run --summary-export=k6-auth-onboarding.json src/tests/load/k6/scenarios/auth-onboarding.js
        env:
          DEMO_EMAIL: demo@example.com
          DEMO_PASSWORD: DemoPassword123!

      - name: k6 passwordless-signup (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Relies on TEST_MODE=true (job env) so /auth/email/send-code echoes debug_verification_code.
        run: >
          k6 run --summary-export=k6-passwordless-signup.json src/tests/load/k6/scenarios/passwordless-signup.js

      - name: k6 daily-ops (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: k6 run --summary-export=k6-daily-ops.json src/tests/load/k6/scenarios/daily-ops.js

      - name: k6 billing (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: k6 run --summary-export=k6-billing.json src/tests/load/k6/scenarios/billing.js

      - name: k6 webhooks (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: k6 run --summary-export=k6-webhooks.json src/tests/load/k6/scenarios/webhooks.js

      - name: k6 admin (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: k6 run --summary-export=k6-admin.json src/tests/load/k6/scenarios/admin.js

      - name: Refresh load-test credentials (before the organization-scoped scenarios)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Access tokens live 15 minutes; the block below would outlast one minted earlier.
        run: bash src/tests/load/k6/export-load-test-credentials.sh

      - name: k6 org-scoped routes (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Every scenario runs even when an earlier one fails (bash -e stopped the block at the first
        # failure, so the rest never ran); the step still fails when any of them did.
        run: |
          failed=0
          k6 run --summary-export=k6-audit-list.json src/tests/load/k6/scenarios/audit-list.js || failed=1
          k6 run --summary-export=k6-org-membership-list.json src/tests/load/k6/scenarios/org-membership-list.js || failed=1
          k6 run --summary-export=k6-notification-policy.json src/tests/load/k6/scenarios/notification-policy-crud.js || failed=1
          k6 run --summary-export=k6-billing-subscriptions-rls.json src/tests/load/k6/scenarios/billing-subscriptions-rls.js || failed=1
          k6 run --summary-export=k6-user-data-export.json src/tests/load/k6/scenarios/user-data-export.js || failed=1
          k6 run --summary-export=k6-rls-concurrency.json src/tests/load/k6/scenarios/rls-concurrency-beyond-pool.js || failed=1
          exit "$failed"
        env:
          ADMIN_TOKEN: ${{ env.ADMIN_TOKEN }}
          TEST_TOKEN: ${{ env.TEST_TOKEN }}
          TEST_ORG_ID: ${{ env.TEST_ORG_ID }}

      - name: Refresh load-test credentials (before the organization-write scenarios)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Access tokens live 15 minutes; the block below would outlast one minted earlier.
        run: bash src/tests/load/k6/export-load-test-credentials.sh

      - name: k6 organization writes (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Every scenario runs even when an earlier one fails; the step still fails when any did.
        run: |
          failed=0
          k6 run --summary-export=k6-member-role-permission-list.json src/tests/load/k6/scenarios/member-role-permission-list.js || failed=1
          k6 run --summary-export=k6-permission-write.json src/tests/load/k6/scenarios/permission-write.js || failed=1
          k6 run --summary-export=k6-tenancy-role-write.json src/tests/load/k6/scenarios/tenancy-role-write.js || failed=1
          k6 run --summary-export=k6-organization-settings-write.json src/tests/load/k6/scenarios/organization-settings-write.js || failed=1
          k6 run --summary-export=k6-notification-write.json src/tests/load/k6/scenarios/notification-write.js || failed=1
          k6 run --summary-export=k6-organization-api-key-lifecycle.json src/tests/load/k6/scenarios/organization-api-key-lifecycle.js || failed=1
          exit "$failed"

      - name: Seed the fe-full-surface user pool
        if: ${{ !cancelled() }}
        continue-on-error: true
        # A bulk seed of 12 organizations × 10 users, then the credential pool fe-full-surface signs in
        # from (src/tests/load/k6/data/credential-pool.json). Last, so the extra rows cannot shift the
        # scenarios before it.
        run: pnpm db:seed:loadtest

      - name: k6 fe-full-surface (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        # Every call core-fe makes, walked once by each of 20 pool users; the scenario header lists the
        # calls it cannot reach. Signs in with the static code (job env), so it needs no mail.
        run: k6 run --summary-export=k6-fe-full-surface.json src/tests/load/k6/scenarios/fe-full-surface.js

      - name: Upload k6 summaries and server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: k6-load-test-artifacts
          path: |
            k6-*.json
            server.log
          retention-days: 14

      - name: Send load-test results email (from k6 summaries)
        # A step's own `env:` is not visible to its `if:` (evaluated first), so the former
        # `env.RESEND_API_KEY != ''` read the job env — where the secret never is — and the
        # email never went out. The check lives in the script instead; the secrets must not move
        # to the job env, or the API server under load would send real email.
        if: always()
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_RESULT_EMAIL_TO: ${{ secrets.TEST_RESULT_EMAIL_TO }}
          BASE_URL: http://localhost:3000
          K6_USE_SUMMARIES: '1'
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$TEST_RESULT_EMAIL_TO" ]; then
            echo "RESEND_API_KEY or TEST_RESULT_EMAIL_TO is not set — skipping the results email."
            exit 0
          fi
          pnpm tool:send-load-test-results-email

      - name: Stop API server
        if: always()
        uses: ./.github/actions/stop-api-server

      - name: Enforce gate success (SLO)
        if: always() && (steps.gate.outcome == 'failure' || steps.gate.outcome == 'cancelled')
        run: |
          echo "::error::k6 gate failed — a gate scenario breached its SLO thresholds (read the Gate step for which)."
          exit 1

  resolve-success:
    name: Close ci-failure issue
    needs: [k6]
    # Only the nightly run speaks for main — a manual dispatch tests whatever ref it was started
    # on, feature branches included.
    if: always() && github.event_name == 'schedule' && needs.k6.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the open ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly k6 load SLO failing"
          existing="$(gh issue list --repo "$GH_REPOSITORY" --state open --label ci-failure \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            echo "No open ci-failure issue to close."
            exit 0
          fi
          gh issue close "$existing" --repo "$GH_REPOSITORY" \
            --comment "The nightly k6 run is green again on main — closing automatically. Run: ${WORKFLOW_URL}"
          echo "Closed ci-failure issue #${existing}."

  notify-failure:
    name: Notify failure
    needs: [k6]
    if: always() && github.event_name == 'schedule' && needs.k6.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update ci-failure issue
        # This run was red every night from its first one — it never got past the seed step — and
        # nothing said so. An issue produces a real notification; repeats collect as comments.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create ci-failure --repo "$GH_REPOSITORY" \
            --color D93F0B --description "Automated post-merge/guard failure notification" \
            2>/dev/null || true
          title="Nightly k6 load SLO failing"
          body="$(printf '%s\n' \
            "Run: ${WORKFLOW_URL}" \
            "" \
            "The nightly k6 run on main is red: a gate scenario breached its SLO thresholds, or the" \
            "run never reached k6 (migrate, seed or API boot failed — read the step list first)." \
            "" \
            "The k6-load-test-artifacts upload holds every k6-*.json summary and server.log." \
            "Reproduce: docs/reference/testing/load-testing.md. The next green nightly closes this issue.")"
          existing="$(gh issue list --repo "$GH_REPOSITORY" --state open --label ci-failure \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPOSITORY" --body "$body"
            echo "Commented on existing ci-failure issue #${existing}."
          else
            gh issue create --repo "$GH_REPOSITORY" --title "$title" --label ci-failure --body "$body"
          fi
