autoInstallPeers: true
engineStrict: true
# Pin the Node version pnpm runs scripts with so environments that boot an
# older Node (e.g. the Claude Code web sandbox defaults to Node 22) don't trip
# the engineStrict gate — pnpm self-provisions this version. Keep in sync with
# .nvmrc / .node-version / engines.node (>=24).
useNodeVersion: 24.18.1

allowBuilds:
  # Telemetry package pulled in transitively; deny its postinstall build so a
  # strict install does not fail on an undecided build script (ERR_PNPM_IGNORED_BUILDS).
  '@scarf/scarf': false
  '@sentry/node-cpu-profiler': true
  argon2: true
  cpu-features: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: true
  vue-demi: false

packageExtensions:
  openapi-to-postmanv2:
    dependencies:
      lodash: 4.17.24
      js-yaml: ^4.1.1
  postman-collection:
    dependencies:
      lodash: 4.17.24
  '@esbuild-kit/core-utils':
    dependencies:
      esbuild: ^0.25.0

overrides:
  # Transitive advisories with no direct upgrade path (`deps:audit` is a required
  # PR-CI gate). CARET-BOUNDED on purpose: an open-ended `>=3.3.17` resolves to the
  # highest match and silently moves postcss onto the ESM-only 5.x major. Verify in
  # the lockfile, not the audit summary.
  'nanoid@<3.3.17': '^3.3.17'
  'nanoid@>=4.0.0 <5.1.16': '^5.1.16'
  '@babel/core': '>=7.29.1'
  # body-parser <2.3.0 — GHSA-v422-hmwv-36x6 (low): DoS when an invalid limit
  # silently disables size enforcement (transitive via @modelcontextprotocol/sdk
  # > express). Fixed in 2.3.0.
  body-parser: '>=2.3.0'
  # Keep ioredis deduplicated so workers/queues see exactly one copy — two copies caused TS type
  # errors (docs/reviews/full-codebase-review-deliverables.md). The old exact pin existed because
  # BullMQ pinned an exact ioredis in its `dependencies`; as of BullMQ 6 ioredis is an OPTIONAL PEER
  # (`>=5.0.0`), so the lockstep rule no longer applies and a range is enough to dedupe.
  ioredis: '>=6.0.0'
  esbuild: '>=0.28.1'
  '@esbuild-kit/core-utils>esbuild': '>=0.28.1'
  lodash: '>=4.17.24'
  '@grpc/grpc-js': '>=1.14.4'
  # js-yaml 5.0.0–5.2.0 — GHSA-724g-mxrg-4qvm (moderate): quadratic-complexity
  # DoS via !!omap in YAML11_SCHEMA (transitive via markdownlint-cli2). Fixed in 5.2.1.
  # js-yaml 5.0.0–5.2.1 — GHSA-pm4m-ph32-ghv5 (high): exponential parsing time in
  # flow collections leads to DoS (transitive via @commitlint/cli + markdownlint-cli2).
  # Fixed in 5.2.2.
  js-yaml: '>=5.2.2'
  fast-xml-parser: '>=5.7.0'
  # hono <4.12.34 — GHSA-8j4g-w8fx-2239 (moderate): ReDoS in CORS middleware via
  # Access-Control-Request-Headers. Also covers earlier GHSA-xgm2-5f3f-mvvc /
  # GHSA-hvrm-45r6-mjfj / GHSA-w62v-xxxg-mg59. Transitive via
  # @modelcontextprotocol/sdk + @scalar/cli. Fixed in 4.12.34.
  hono: '>=4.12.34'
  # @hono/node-server <2.0.10 — GHSA-frvp-7c67-39w9 (path traversal, <2.0.5) and
  # GHSA-9mqv-5hh9-4cgg (unauthenticated memory-leak DoS via aborted WebSocket
  # handshake, <=2.0.9). Transitive via @modelcontextprotocol/sdk + @scalar/cli.
  # Fixed in 2.0.10.
  '@hono/node-server': '>=2.0.10'
  markdown-it: '>=14.1.1'
  minimatch: 10.2.5
  # brace-expansion <5.0.7 — CVE-2026-13149 (HIGH): ReDoS via exponential-time
  # complexity in expansion. Transitive (minimatch et al.); fixed in 5.0.7.
  # brace-expansion >=4.0.0 <5.0.8 — GHSA-mh99-v99m-4gvg (high): DoS via unbounded
  # expansion length causing an out-of-memory crash. Fixed in 5.0.8.
  brace-expansion: '>=5.0.8'
  micromatch>picomatch: 4.0.4
  rollup: '>=4.59.0'
  vite: '>=8.0.16 <9'
  fastify: '>=5.8.5'
  # @fastify/static <=10.1.0 — GHSA-83w8-p2f5-377r (high): route-guard bypass via
  # path traversal; <=10.1.1 — GHSA-8pvw-jcv7-9cmj (moderate): authorization bypass
  # via non-canonical URL paths. Transitive via @bull-board/fastify + @scalar/cli.
  # Fixed in 10.1.2.
  '@fastify/static': '>=10.1.2'
  # postcss <=8.5.17 — GHSA-r28c-9q8g-f849 (high): path traversal in previous
  # source-map auto-loading (sourceMappingURL) discloses arbitrary .map files.
  # Transitive via @scalar/cli > vue > @vue/compiler-sfc. Fixed in 8.5.18.
  postcss: '>=8.5.18'
  # fast-uri <3.1.6 — GHSA-jqff-g426-hqxp (high): a further host-confusion
  # variant on top of the GHSA-7p8r-x3mc-p8w7 / GHSA-4c8g-83qw-93j6 /
  # GHSA-v2hh-gcrm-f6hx family already covered by the 3.1.5 floor below — this
  # repo's floor was stale against the newer advisory. Transitive via fastify's
  # ajv/find-my-way URI handling (request validation + response serialization
  # hot path). Cap <4 so the override stays on the patched 3.x line ajv
  # declares (^3.x); do not let an uncapped floor silently major-bump to 4.x.
  # Fixed in 3.1.6.
  fast-uri: '>=3.1.6 <4'
  # @faker-js/faker <=10.4.0 — GHSA-qxc2-j82w-r537 (high): helpers.fake is
  # exploitable into arbitrary code execution via a crafted template string.
  # Transitive via @scalar/cli>@scalar/mock-server and
  # openapi-to-postmanv2>postman-collection (both dev-only tooling — no
  # runtime exposure — but deps:audit does not distinguish dev/prod). 10.4.1
  # was never published; the fix landed in 10.5.0.
  '@faker-js/faker': '>=10.5.0'
  # find-my-way <=9.6.0 — GHSA-c96f-x56v-gq3h (high): DDoS via HTTP/2 request
  # smuggling in the router. Transitive via fastify (also fastify-type-provider-zod,
  # @scalar/cli). Fixed in 9.6.1.
  find-my-way: '>=9.6.1'
  dompurify: '>=3.4.11'
  drizzle-orm: '>=0.45.2'
  i18next-fs-backend: '>=2.6.4'
  i18next-http-middleware: '>=3.9.3'
  # qs >=6.14.2 <=6.15.3 — GHSA-x5fp-wj9c-mxmx (moderate): array-limit bypass
  # via bracket-key comma parsing. This repo's floor (6.15.2) predates the
  # advisory's own fix version. Transitive via @stryker-mutator/core>
  # typed-rest-client (dev-only) and @modelcontextprotocol/sdk>express (the
  # MCP tooling path, not the HTTP server's own request parsing). Fixed in 6.16.0.
  qs: '>=6.16.0'
  tmp: '>=0.2.6'
  # undici <7.29.0 — GHSA-8xcm-r25x-g524 / GHSA-m8rv-5g2x-5cg5 /
  # GHSA-jr45-8vmc-qm54 / GHSA-v3r7-h72x-cjcm (moderate–high): various
  # injection / disclosure issues. Transitive via @scalar/cli. Fixed in 7.29.0.
  undici: '>=7.29.0 <8'
  uuid: '>=11.1.1'
  yaml@1.10.2: 1.10.3
