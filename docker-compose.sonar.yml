# Local SonarQube instance for code quality analysis.
# Usage:
#   docker compose -f docker-compose.sonar.yml up -d   # start SonarQube
#   docker compose -f docker-compose.sonar.yml run --rm scanner  # run scan
#   docker compose -f docker-compose.sonar.yml down -v           # teardown
#
# Dashboard: http://localhost:9000  (admin / admin on first login)

services:
  sonarqube:
    image: sonarqube:25.5.0.107428-community
    container_name: core-be-sonarqube
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/api/system/status | grep -q "UP"']
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s

  scanner:
    image: sonarsource/sonar-scanner-cli:11
    container_name: core-be-sonar-scanner
    profiles: ['scan']
    depends_on:
      sonarqube:
        condition: service_healthy
    volumes:
      - .:/usr/src
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    # SCM analysis is off: the gate fails on ANY open issue, so blame/new-code data never changes its
    # verdict — and the scanner's JGit crashes ("Bare Repository has neither a working tree, nor an
    # index") on a checkout whose shared .git/config sets core.bare=true with per-worktree overrides
    # (extensions.worktreeConfig), which git itself handles.
    # The token comes ONLY from the SONAR_TOKEN environment variable above, which the scanner reads
    # natively. Passing it again as -Dsonar.token made the scanner log "Property 'sonar.token' with
    # value '<token>' is overridden with value '<token>'" — the token in plain text in every
    # pre-commit run's output. (No comments inside the folded block below: it is one command line.)
    command: >
      sonar-scanner
        -Dsonar.scm.disabled=true
        -Dsonar.projectKey=core-be
        -Dsonar.projectName="core-be"
        -Dsonar.projectVersion=3.5.1-dev.0
        -Dsonar.host.url=http://sonarqube:9000

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
